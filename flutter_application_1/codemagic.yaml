workflows:
  android-ios-workflow:
    name: Android ve iOS Build
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Flutter bağımlılıklarını yükle
        script: flutter pub get
      - name: Android APK Oluştur
        script: flutter build apk --release
      - name: iOS IPA Oluştur
        script: |
          # Not: iOS için sertifika (p12) ve provisioning profile gerekir
          flutter build ipa --release --export-method development
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
      - build/ios/ipa/*.ipa
